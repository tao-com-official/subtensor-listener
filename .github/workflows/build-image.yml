name: Build image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tao-com-official/subtensor-listener
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: vars
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          EPOCH_TIME=$(date +%s)
          TAG="${COMMIT_HASH}-${EPOCH_TIME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote_prod:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build_image
    if: github.ref_name == 'main' && github.actor != 'dependabot[bot]'
    outputs:
      promote_tag: ${{ steps.promote.outputs.promote_tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as prod
        id: promote
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ needs.build_image.outputs.image_tag }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build_image.outputs.image_tag }}
          echo "promote_tag=prod-${{ needs.build_image.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "Pushed prod-${{ needs.build_image.outputs.image_tag }}"

  # The production environment (main only) gates this job and holds the prod
  # writer App key; versions bump.yaml opens the prod-bump/ PR.
  bump:
    needs: promote_prod
    permissions: {}
    uses: tao-com-official/versions/.github/workflows/bump.yaml@main
    with:
      environment: production
      files: prod/subtensor-listener/values.yaml
      tag: ${{ needs.promote_prod.outputs.promote_tag }}
    secrets: inherit
