name: Build image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tao-com-official/subtensor-listener
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_image:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: vars
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          EPOCH_TIME=$(date +%s)
          TAG="${COMMIT_HASH}-${EPOCH_TIME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote_prod:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build_image
    if: github.ref_name == 'main' && github.actor != 'dependabot[bot]'
    outputs:
      promote_tag: ${{ steps.promote.outputs.promote_tag }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as prod
        id: promote
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ needs.build_image.outputs.image_tag }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build_image.outputs.image_tag }}
          echo "promote_tag=prod-${{ needs.build_image.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "Pushed prod-${{ needs.build_image.outputs.image_tag }}"

  # The production environment (reviewers, main only) gates this job and holds
  # the prod writer App key. This repo is public, so it cannot call the private
  # versions bump.yaml; it runs the same scripts/bump-pr.sh from the versions
  # checkout instead, which opens a prod-bump/ PR as the prod writer App.
  bump:
    needs: promote_prod
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    permissions: {}
    steps:
      - name: Mint versions token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.VERSIONS_PROD_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSIONS_PROD_APP_PRIVATE_KEY }}
          owner: tao-com-official
          repositories: versions
          permission-contents: write
          permission-pull-requests: write

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Pin promoted image in versions
        env:
          TAG: ${{ needs.promote_prod.outputs.promote_tag }}
          VERSIONS_TOKEN: ${{ steps.app.outputs.token }}
          BUMP_BRANCH_PREFIX: prod-bump
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:${VERSIONS_TOKEN}@github.com/tao-com-official/versions.git" versions-repo
          cd versions-repo
          git config user.email "ci@tao.com"
          git config user.name "versions bump"
          yq e '.image.tag = strenv(TAG)' -i prod/subtensor-listener/values.yaml
          if git diff --quiet; then
            echo "prod/subtensor-listener is already pinned to ${TAG}."
            exit 0
          fi
          git commit -qam "chore: bump prod/subtensor-listener/values.yaml to ${TAG} (${GITHUB_REPOSITORY})"
          scripts/bump-pr.sh
